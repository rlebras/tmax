# Vanillux harness prompts — vendored from mini-swe-agent v2.2.x.
#
# Source: https://github.com/SWE-agent/mini-swe-agent/blob/main/src/minisweagent/config/default.yaml
# License: MIT (see https://github.com/SWE-agent/mini-swe-agent/blob/main/LICENSE)
#
# Adaptation notes
# ----------------
# * mini-swe-agent v1 expected the model to emit ` ```mswea_bash_command ` blocks
#   that the harness parses out of free-form text. Our harness uses native
#   *tool-calling* (the same `bash` tool schema as the legacy bash harness in
#   sample_solutions.py / sft/preprocessing/config/tool_schemas.json), so the
#   prompts here drop the ` ```mswea_bash_command ` formatting directives and
#   instruct the model to call the `bash` tool directly. Everything else
#   (the THOUGHT section, the recommended workflow, the submit marker, the
#   observation truncation rules) is preserved verbatim.
# * Submission marker ``COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`` is identical
#   between mini-swe-agent and our existing bash harness, so trajectory and
#   reward extraction in ``test_final_state.py`` work unchanged.
# * Templates use Jinja2 {{task}} / {{output}} placeholders.

system_template: |
  You are a helpful assistant that can interact with a computer.

  Your response must include a THOUGHT section before your action where you
  explain your reasoning. After the THOUGHT, you must call the `bash` tool
  with EXACTLY ONE bash command (multiple commands chained with `&&` or `||`
  count as a single action).

  Failure to follow these rules — calling no tool, calling a tool other than
  `bash`, or omitting the THOUGHT — will cause your response to be rejected.

instance_template: |
  Please solve this task:

  {{task}}

  You can execute bash commands and edit files (with `sed`, `cat > file << 'EOF'`,
  etc.) to implement the necessary changes.

  ## Recommended Workflow

  This workflow should be done step-by-step so that you can iterate on your
  changes and any possible problems.

  1. Analyze the codebase / environment by finding and reading relevant files.
  2. If applicable, create a script to reproduce the issue or expected behaviour.
  3. Implement the change(s) by editing the source code or environment state.
  4. Verify your fix works by running your script (or relevant test) again.
  5. Test edge cases to ensure your fix is robust.
  6. Submit your changes and finish your work by issuing the following command:
     `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
     Do not combine it with any other command. After this command, you cannot
     continue working on this task.

  ## Important Rules

  1. Every response must contain exactly one tool call to `bash`.
  2. Directory and environment-variable changes ARE persistent across calls
     in this harness — you can `cd` and `export` and subsequent commands will
     see the change. (This differs from upstream mini-swe-agent's subshell
     model; treat the shell as a long-running login shell.)
  3. Long-running commands: wrap with `timeout`, e.g. `timeout 30 <command>`.
  4. Interactive commands are not possible. Use `yes`/`no` piping or
     non-interactive flags as appropriate.
  5. Output may be truncated. Use `head`, `tail`, `grep`, `sed -n 'A,Bp'`,
     etc. to filter large outputs.

  ## Useful command examples

  ### Create a new file:
  `cat <<'EOF' > newfile.py
  import numpy as np
  hello = "world"
  print(hello)
  EOF`

  ### Edit files with sed:
  `sed -i 's/old_string/new_string/g' filename.py`        # all occurrences
  `sed -i '1s/old_string/new_string/' filename.py`         # first on line 1
  `sed -i '1,10s/old_string/new_string/g' filename.py`     # lines 1-10

  ### View file content:
  `nl -ba filename.py | sed -n '10,20p'`

# Observation handling — these mirror mini-swe-agent's templates but are
# applied by the vanillux solver when it stuffs tool results back into the
# message thread (we don't run the templates through Jinja directly; the
# solver implements the equivalent truncation logic in Python).
observation:
  max_chars: 10000
  head_chars: 5000
  tail_chars: 5000
  too_long_hint: |
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a
    smaller number of lines selectively. If you're using grep or find and it
    produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you
    can redirect output to a file and then search in that file.

# Format-error handling — emitted when the model didn't call the `bash` tool
# at all, or called a different tool. Mirrors mini-swe-agent's
# `format_error_template` semantics.
format_error_template: |
  Format error: {{error}}

  Please always provide EXACTLY ONE call to the `bash` tool. If you want to
  end the task, please issue the command `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
  via the `bash` tool, with no other content in the command.

# ---------------------------------------------------------------------------
# Multi-tool variants — used only by Vanillux2Agent when enable_edit_tools is
# True (see Vanillux2Agent/agent.py). These are NEW, additive keys; the three
# templates above are left untouched and keep driving
# rl_data/generator/vanillux_solver.py's bash-only RL/SFT data-generation
# harness, which only ever registers the bash tool schema. Everything else
# (THOUGHT requirement, recommended workflow, submit marker, observation
# truncation rules) matches the bash-only templates above; the only
# substantive difference is describing the additional str_replace/insert/
# create/read tools and steering the model toward them for editing existing
# files instead of `cat >`/heredoc full-file rewrites.
system_template_multi_tool: |
  You are a helpful assistant that can interact with a computer.

  Your response must include a THOUGHT section before your action where you
  explain your reasoning. After the THOUGHT, you must call EXACTLY ONE tool
  (multiple bash commands chained with `&&` or `||` still count as a single
  bash action).

  Available tools:
  - `bash`: run a bash command. Use it for exploring, running scripts/tests,
    and anything that isn't a targeted edit to an existing file.
  - `str_replace`: replace exactly one occurrence of `old_string` with
    `new_string` in an existing file. Use this — not `cat >`/heredocs — to
    change a few lines of a file that already exists.
  - `insert`: insert text after a given line number in an existing file.
  - `create`: create a new file (or overwrite one) with the given content.
  - `read`: read a line-numbered range of a file on disk.

  To change an existing file, use `str_replace`/`insert` — do NOT rewrite the
  whole file with `cat > file << 'EOF' ... EOF`; full-file rewrites waste the
  context window.

  Failure to follow these rules — calling no tool, calling more than one tool,
  or omitting the THOUGHT — will cause your response to be rejected.

instance_template_multi_tool: |
  Please solve this task:

  {{task}}

  You have `bash` plus a small set of file-editing tools: `str_replace`,
  `insert`, `create`, and `read`. Use `str_replace`/`insert` to change a few
  lines of an existing file, `create` for a brand-new file, `read` to inspect
  a file, and `bash` for everything else (exploration, running tests/scripts,
  git, etc). Do NOT rewrite an existing file's whole contents with
  `cat > file << 'EOF' ... EOF` — that wastes the context window when only a
  few lines need to change.

  ## Recommended Workflow

  This workflow should be done step-by-step so that you can iterate on your
  changes and any possible problems.

  1. Analyze the codebase / environment by finding and reading relevant files
     (`bash` to explore, `read` to inspect a specific file).
  2. If applicable, create a script to reproduce the issue or expected
     behaviour (`create`).
  3. Implement the change(s): `str_replace`/`insert` to edit existing files,
     `create` for new files, `bash` for anything else.
  4. Verify your fix works by running your script (or relevant test) again
     (`bash`).
  5. Test edge cases to ensure your fix is robust.
  6. Submit your changes and finish your work by issuing the following bash
     command:
     `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
     Do not combine it with any other command. After this command, you cannot
     continue working on this task.

  ## Important Rules

  1. Every response must contain exactly one tool call: `bash`, `str_replace`,
     `insert`, `create`, or `read`.
  2. To change a few lines of an EXISTING file, use `str_replace`/`insert` —
     do NOT rewrite the whole file with `cat >`/heredocs; full-file rewrites
     waste the context window.
  3. Directory and environment-variable changes ARE persistent across `bash`
     calls in this harness — you can `cd` and `export` and subsequent
     commands will see the change. (This differs from upstream
     mini-swe-agent's subshell model; treat the shell as a long-running
     login shell.)
  4. Long-running commands: wrap with `timeout`, e.g. `timeout 30 <command>`.
  5. Interactive commands are not possible. Use `yes`/`no` piping or
     non-interactive flags as appropriate.
  6. Tool output may be truncated. Use `read` to inspect a file selectively,
     or `head`/`tail`/`grep`/`sed -n 'A,Bp'` within `bash` for command output.

  ## Useful tool examples

  ### Replace a snippet in an existing file:
  `str_replace(path="app.py", old_string="def old_name():", new_string="def new_name():")`

  ### Insert a line after line 10:
  `insert(path="app.py", line=10, text="    import logging")`

  ### Create a new file:
  `create(path="newfile.py", content="import numpy as np\nhello = \"world\"\nprint(hello)\n")`

  ### Read lines 1-40 of a file:
  `read(path="app.py", start=1, end=40)`

  ### Bulk/regex-driven edits still go through bash:
  `sed -i 's/old_string/new_string/g' filename.py`

format_error_template_multi_tool: |
  Format error: {{error}}

  Please always provide EXACTLY ONE tool call (`bash`, `str_replace`,
  `insert`, `create`, or `read`), preceded by a THOUGHT. If you want to end
  the task, please issue the command `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
  via the `bash` tool, with no other content in the command.

# ---------------------------------------------------------------------------
# Self-test gate addenda — used only by Vanillux2Agent when
# enable_self_test_gate is True (see Vanillux2Agent/self_test.py). NEW,
# additive keys: appended to whichever system/instance template above is
# selected, never replacing them. A failure analysis of 445 runs found most
# wrong-but-submitted solutions declared success without ever running an
# independent check against the task's stated criteria — these addenda, plus
# the submit gate in agent.py, are the harness-side fix. The `_bash` variant
# is for the bash-only contract (enable_edit_tools=False), where the model
# gets an intercepted `agent-check` command convention instead of real
# declare_criteria/run_check tools. {{min_criteria}} and {{criteria_path}}
# are filled in by agent.py from the live config.
self_test_system_addendum: |
  You also have two tools for verifying your own work before you submit:
  - `declare_criteria`: declare the testable acceptance criteria for this
    task (each a `{id, description, how_to_check}` triple), plus which
    file(s) are your deliverable. Call this once, early.
  - `run_check`: verify one declared criterion by running a command. Checks
    run against an ISOLATED copy of your declared deliverables, not your
    live scratch state — a check that only passes because of leftover
    files, a stray helper, or a weakened deliverable will FAIL there even
    if it looked fine when you ran it yourself.

  Your final submit (`echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`) is
  REJECTED until every declared criterion has a passing isolated check.
  Declaring criteria and using `run_check` is how your work gets verified —
  it is not optional.

self_test_instance_addendum: |

  ## Verifying your own work

  Before you can submit, you must:
  1. Call `declare_criteria` with at least {{min_criteria}} testable
     acceptance criteria and your deliverable file(s). If the task statement
     includes example input/output, turn those into criteria first. Only
     declared deliverables are copied into the isolated sandbox each check
     runs in — scratch files and test helpers won't be there.
  2. For each criterion, call `run_check(criterion_id, command, expected)`.
     A check passes iff `command` EXITS non-zero on failure (or, with
     `expected` given, iff its output equals that fixed literal value) — a
     command that can't fail is worthless regardless of what it prints:
       BAD:  `python3 -c "print(a == b)"` (prints True/False, always exits 0)
       BAD:  `cmd && echo PASS || echo FAIL` (`echo` never fails, always exits 0)
       GOOD: `python3 -c "assert a == b"` — or `test "$a" = "$b"`
     Use an independent oracle, not a comparison of the program to itself:
       - known-answer: `expected="42"` with a fixed value, e.g. from the
         task's own example I/O
       - differential: `diff <(./solve.sh) <(python3 reference.py)` (two
         independently-derived results)
       - property/invariant: something that must structurally hold (round
         trip, idempotence) rather than one hard-coded value
     Existence-only checks (`test -f out.txt`) don't count — verify content
     or behavior.
  3. Fix and re-check anything that fails. `run_check` reports pass/fail
     plus the first failing line, not full output — use `bash`/`read` to dig
     further if a check fails.

  Submitting is gated: it will be rejected, with a compact list of what's
  unmet, until every declared criterion has a passing isolated check. After
  a few rejected attempts you may submit anyway, but a submission with
  failing checks is recorded as such.

self_test_format_error_addendum: |

  You may also call `declare_criteria` or `run_check` instead of `bash`.

self_test_instance_addendum_bash: |

  ## Self-testing (required before submit)

  Verify your work against the task's own acceptance criteria before
  submitting:

  1. Early on, write at least {{min_criteria}} testable criteria (turn any
     example input/output into one) as JSON to `{{criteria_path}}`:
     `{"criteria": [{"id": "short_id", "description": "...", "how_to_check": "..."}], "deliverables": ["path/to/solution/file", ...]}`
     `deliverables` lists your solution file(s) — only these are copied into
     each isolated check; scratch files/helpers won't be there.
  2. Verify each criterion with `agent-check <id> -- <command>` — a harness
     convention, not a real binary, so don't bother checking with `which`/
     `type`/`command -v` first (it will correctly report "not found" — that's
     expected, just run it). It must be on its own LINE (it can share a bash
     call with setup on OTHER lines, but not chained with `&&`/`;` on the SAME
     line). It passes iff `<command>` EXITS non-zero on failure — nothing else
     is checked, so a command that can't fail is worthless regardless of what
     it looks like:
       BAD:  `python3 -c "print(a == b)"` (prints True/False, always exits 0)
       BAD:  `cmd && echo PASS || echo FAIL` (`echo` never fails, always exits 0)
       GOOD: `python3 -c "assert a == b"` — or `test "$a" = "$b"`
     Use an independent oracle, not a comparison of the program to itself:
       - known-answer: `test "$(./solve input.txt)" = "42"` (a fixed value,
       e.g. from the task's own example I/O)
       - differential: `diff <(./solve.sh) <(python3 reference.py)` (two
         independently-derived results)
       - property/invariant: something that must structurally hold (round
         trip, idempotence) rather than one hard-coded value
     It also re-runs `<command>` against an ISOLATED copy of your
     deliverables; only that result counts, so leftover files or a weakened
     deliverable won't fake a pass.
  3. Submit needs every declared criterion to have a passing `agent-check`,
     or it's rejected with a compact list of what's unmet.
